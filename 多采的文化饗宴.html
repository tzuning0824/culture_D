main{position:fixed;inset:17% 17% 14% 17%;overflow:auto;padding:4px 10px}
h1{font:700 26px var(--f);color:var(--red);text-align:center;margin:0 0 4px;letter-spacing:2px}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.nav button,.btn{border:2px solid var(--br);background:var(--card);color:var(--br);border-radius:999px;padding:8px 16px;font:700 16px var(--f);cursor:pointer}
.nav button.on,.btn.go{background:var(--th);border-color:var(--th);color:#fff}
.box{padding:6px 4px;margin-bottom:10px}
.login{text-align:center}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px}
.pager .sp{flex:1}
.pager .sm{font-size:14px;padding:6px 12px;opacity:.8}
.gbtn{display:inline-block;margin:5px;min-width:64px}
.gbtn.on{background:var(--th);color:#fff;border-color:var(--th)}
.title{font:700 44px var(--f);color:var(--th);text-align:center;margin:0 0 6px;letter-spacing:2px}
.q{font:700 26px var(--f);color:var(--th);text-align:center}
.steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0;font:700 15px var(--f);color:var(--sub)}
.row{display:flex;gap:8px;margin:12px 0}
input[type=text]{flex:1;min-width:0;font:inherit;padding:10px 14px;border:2px solid var(--br);border-radius:14px;background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--br);color:#fff;border-radius:16px;padding:8px 20px;font:700 22px var(--f);position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{color:var(--sub);font-size:15px;text-align:center}
.sel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:10px;font:700 18px var(--f)}
select{font:700 18px var(--f);padding:6px 12px;border-radius:12px;border:2px solid var(--br);background:var(--card);color:var(--th)}
.gl{font:700 24px var(--f);color:var(--th)}
.board{display:grid;grid-template-columns:1fr 8px 1fr;gap:12px;min-height:300px;margin-top:8px}
.vline{background:var(--th);border-radius:4px}
.zone{border-radius:16px;padding:8px;min-height:240px;display:flex;flex-direction:column;gap:10px;align-items:center}
.zone.hot{outline:3px dashed var(--th);background:rgba(168,46,30,.07)}
.pill{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--th);color:#fff;border-radius:16px;padding:8px 14px;font:700 22px var(--f)}
.pill input{width:7em;max-width:50%;background:transparent;border:0;border-bottom:3px solid #fff;border-radius:0;color:#fff;text-align:center;font:700 22px var(--f);padding:2px}
.pill input::placeholder{color:rgba(255,255,255,.6)}
#pool{min-height:64px;margin:12px 0;background:var(--bg);border:2px dashed var(--line);flex-direction:row;flex-wrap:wrap;justify-content:center;min-height:64px}
.mid{text-align:center;font:700 15px var(--f);color:var(--sub);margin-bottom:6px}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9;transform:translate(-50%,-50%)}
.big{font:700 28px var(--f);text-align:center;line-height:1.7;color:var(--th)}
.tag{display:inline-block;border-radius:16px;padding:4px 18px;margin:5px;background:var(--br);color:#fff}
.x{border:0;background:none;color:#fff;cursor:pointer;opacity:.6;padding:0 0 0 8px;font-size:14px}
@media(max-width:700px){main{inset:15% 8% 12% 8%}}
@media(max-width:560px){.board{grid-template-columns:1fr 6px 1fr}.q{font-size:21px}.title{font-size:32px}.chip{font-size:18px;padding:6px 14px}.pill,.pill input{font-size:17px}}
</style>
</head>
<body>
<main>
<h1>多采的文化饗宴</h1>
<div id="status" class="hint"></div>
<div id="view"></div>
<div class="pager" id="pager"></div>
</main>
<script>
const PG=['g1','g2','g3','sort','sum'];
const TT={g1:'春節',g2:'端午節',g3:'聖誕節'};
const GT={A:'春節',B:'春節',C:'端午節',D:'端午節',E:'聖誕節',F:'聖誕節'};
const TH={'春節':'#a82e1e','端午節':'#667a3f','聖誕節':'#b9534b'};
let db=null,user=null,uid='u'+Math.random().toString(36).slice(2,8);
let W=[],P=[],C=[],dragging=false;
let my={group:'',page:0};
try{const g=localStorage.getItem('c_g');if(GT[g])my.group=g;my.page=Math.min(Math.max(+localStorage.getItem('c_p')||0,0),PG.length-1)}catch(e){}
const $=(s)=>document.querySelector(s);
const rows=(s)=>((s&&s.docs)||[]).map(d=>Object.assign({id:d.id},typeof d.data==='function'?d.data():d.data));
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const store=()=>{try{localStorage.setItem('c_g',my.group);localStorage.setItem('c_p',my.page)}catch(e){}};
const topic=()=>TT[PG[my.page]]||GT[my.group];
const key=()=>my.group;

async function init(){
  render();
  try{
    const c=window.claude;
    user=c?await c.use('user'):null;
    if(user){try{uid=await user.id()}catch(e){}}
    db=c?await c.use('db'):null;
  }catch(e){}
  if(!db){$('#status').textContent='⚠️ 無法連線，請確認已登入後重新開啟。';return}
  const tm=setTimeout(()=>{$('#status').textContent='連線較慢，資料可能還沒更新…'},10000);
  const ok=()=>{clearTimeout(tm);$('#status').textContent=''};
  db.collection('words').onSnapshot(s=>{W=rows(s);ok();soft()},()=>{});
  db.collection('place').onSnapshot(s=>{P=rows(s);soft()},()=>{});
  db.collection('cat').onSnapshot(s=>{C=rows(s);soft()},()=>{});
}
function soft(){if(dragging)return;const a=document.activeElement;
  if(a&&a.tagName==='INPUT'){if(a.dataset.keep){syncCatInputs();renderBoardOnly()}else if($('#wl'))fillWords();return}
  render()}
function go(n){my.page=Math.min(Math.max(n,0),PG.length-1);store();render();$('main').scrollTop=0}

function render(){
  const v=$('#view');v.innerHTML='';
  const pg=$('#pager');pg.innerHTML='';
  if(!my.group){loginView(v);return}
  const k=PG[my.page];
  document.documentElement.style.setProperty('--th',TH[topic()]||'#a82e1e');
  if(TT[k])game(v,TT[k]);else if(k==='sort')sortView(v);else sumView(v);
  const pv=el('button','btn','‹ 上一頁');pv.onclick=()=>go(my.page-1);
  const nx=el('button','btn go','下一頁 ›');nx.onclick=()=>go(my.page+1);
  const sw=el('button','btn sm','換組別');sw.onclick=()=>{my.group='';store();render()};
  pg.append(my.page>0?pv:el('span'),sw,my.page<PG.length-1?nx:el('span'));
}

function loginView(v){
  const b=el('div','box login');
  b.append(el('div','title','多采的文化饗宴'));
  b.append(el('div','q','你是哪一組？'));
  let g='';const bs=[];const gb=el('div');gb.style.margin='10px 0';
  Object.keys(GT).forEach(k=>{const x=el('button','btn gbtn',k+' 組');x.onclick=()=>{g=k;bs.forEach(y=>y.classList.remove('on'));x.classList.add('on');msg.textContent=''};bs.push(x);gb.append(x)});
  b.append(gb);
  const msg=el('div','hint','');
  const go2=el('button','btn go','開始');
  go2.onclick=()=>{if(!g){msg.textContent='請先選一個組別喔！';return}my.group=g;my.page=0;store();render()};
  b.append(go2,msg);v.append(b);
}

/* ---------- 聯想遊戲 ---------- */
function game(v,t){
  const b=el('div','box');
  b.append(el('div','title',t));b.append(el('div','q','一講到「'+t+'」，你會想到什麼？'));
  b.append(el('div','steps','1 聽到題目 ➜ 2 聯想 ➜ 3 組內分享 ➜ 4 輸入答案'));
  const r=el('div','row');
  const i=el('input');i.type='text';i.maxLength=12;i.placeholder='輸入一個詞（例如：紅包）';
  const bt=el('button','btn go','送出');
  const send=()=>{const x=i.value.trim();if(!x||!db)return;
    db.collection('words').add({topic:t,text:x,uid:uid,group:my.group,ts:Date.now()});i.value='';i.focus()};
  bt.onclick=send;i.onkeydown=e=>{if(e.key==='Enter')send()};
  r.append(i,bt);b.append(r);
  const c=el('div','chips');c.id='wl';b.append(c);
  v.append(b);fillWords();
}
function fillWords(){
  const c=$('#wl');if(!c)return;c.innerHTML='';const t=topic();
  W.filter(w=>w.topic===t).sort((a,b)=>a.ts-b.ts).forEach(w=>{const k=el('span','chip',w.text);
    if(w.uid===uid){const x=el('button','x','✕');x.onclick=()=>db.doc('words/'+w.id).delete();k.append(x)}
    c.append(k)});
}

/* ---------- 分類 ---------- */
function sortView(v){
  const b=el('div','box');b.id='board';v.append(b);
  b.append(el('div','gl',my.group+'組'));
  b.append(el('div','title',topic()));
  const pool=el('div','zone','');pool.id='pool';pool.dataset.zone='pool';b.append(pool);
  const g=el('div','board');
  g.append(zoneCol('l'),el('div','vline'),zoneCol('r'));b.append(g);
  b.append(el('div','mid','中間線'));
  const m=el('div','zone');m.id='z_m';m.dataset.zone='m';m.style.minHeight='60px';m.style.flexDirection='row';m.style.flexWrap='wrap';m.style.justifyContent='center';m.style.background='var(--m)';b.append(m);
  renderBoardOnly();
}
function zoneCol(z){
  const w=el('div');
  const c=el('div','pill');c.append(el('span',null,'跟'));
  const i=el('input');i.type='text';i.maxLength=8;i.dataset.keep=1;i.id='in_'+z;
  i.onchange=()=>saveCat();c.append(i,el('span',null,'有關'));w.append(c);
  const d=el('div','zone');d.dataset.zone=z;d.id='z_'+z;w.append(d);return w;
}
function curCat(){return C.find(c=>c.id===key())||{}}
function saveCat(){
  const l=$('#in_l').value.trim(),r=$('#in_r').value.trim();
  if(db)db.doc('cat/'+key()).set({topic:topic(),group:my.group,left:l,right:r});
}
function syncCatInputs(){
  const c=curCat();
  [['l',c.left],['r',c.right]].forEach(([z,val])=>{const i=$('#in_'+z);if(i&&document.activeElement!==i)i.value=val||''});
}
function renderBoardOnly(){
  if(!$('#pool'))return;
  syncCatInputs();
  const zones={pool:$('#pool'),l:$('#z_l'),m:$('#z_m'),r:$('#z_r')};
  Object.values(zones).forEach(z=>z.querySelectorAll('.chip').forEach(c=>c.remove()));
  const place={};P.filter(p=>p.id.startsWith(key()+'_')).forEach(p=>place[p.id.slice(key().length+1)]=p.zone);
  W.filter(w=>w.topic===topic()).sort((a,b)=>a.ts-b.ts).forEach(w=>{
    const c=el('span','chip',w.text);c.dataset.id=w.id;
    c.onpointerdown=e=>startDrag(e,c,w);
    (zones[place[w.id]]||zones.pool).append(c);
  });
}
function startDrag(e,c,w){
  e.preventDefault();dragging=true;
  const g=c.cloneNode(true);g.classList.add('ghost');document.body.append(g);
  c.style.opacity='.3';
  const mv=(ev)=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
    document.querySelectorAll('[data-zone]').forEach(z=>z.classList.remove('hot'));
    const z=zoneAt(ev);if(z)z.classList.add('hot')};
  const up=(ev)=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    const z=zoneAt(ev);g.remove();c.style.opacity='';
    document.querySelectorAll('[data-zone]').forEach(x=>x.classList.remove('hot'));
    dragging=false;
    if(z){const pid=key()+'_'+w.id;P=P.filter(x=>x.id!==pid).concat([{id:pid,zone:z.dataset.zone}]);
      if(db)try{db.doc('place/'+pid).set({topic:topic(),group:my.group,wid:w.id,zone:z.dataset.zone}).catch(()=>{})}catch(e){}}
    renderBoardOnly();
  };
  mv(e);
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function zoneAt(ev){const t=document.elementFromPoint(ev.clientX,ev.clientY);return t&&t.closest?t.closest('[data-zone]'):null}

/* ---------- 統整 ---------- */
function norm(s){return s.replace(/^跟/,'').replace(/有關$/,'').trim()}
function sumView(v){
  const cnt={};
  C.forEach(c=>[c.left,c.right].forEach(n=>{n=norm(n||'');if(n)cnt[n]=(cnt[n]||0)+1}));
  const b=el('div','box');
  b.append(el('div','q','同學們把文化分成了…'));
  const names=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const w=el('div','big');
  if(!names.length)w.append(el('div','hint','還沒有分類資料。'));
  names.forEach(([n,k])=>{const t=el('span','tag',n+(k>1?' ×'+k:''));t.style.fontSize=(18+Math.min(k,6)*5)+'px';w.append(t)});
  b.append(w);v.append(b);
  const b2=el('div','box');
  const top=names.slice(0,3).map(x=>'「'+x[0]+'」');
  const t2=el('div','big');t2.append(el('div',null,'文化可能跟'+(top.length?top.join('、'):'「飲食」、「習俗」、「傳說」')+'等等有關'));t2.append(el('div',null,'文化來自於我們的生活'));b2.append(t2);
  v.append(b2);
}
init();
</script>
</body>
</html>
